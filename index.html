<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History Packs</title>
    <link rel="preload" as="image" href="pack-bg.webp" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #1a2020;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        display: block;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }

      /* Pass D — auth overlay (DESIGN.md v2.0) */
      .rg-auth-root {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
      }
      .rg-auth-root.rg-auth-open {
        pointer-events: auto;
      }
      .rg-auth-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(12, 16, 16, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .rg-auth-panel {
        width: min(400px, 100%);
        background: #2a322e;
        border: 2px solid #5a6a5a;
        border-radius: 12px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
        padding: 22px 24px 20px;
        color: #f5e6d3;
      }
      .rg-auth-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }
      .rg-auth-title {
        font-family: Georgia, serif;
        font-size: 22px;
        font-weight: normal;
        color: #f5e6d3;
      }
      .rg-auth-close {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 8px;
        background: #3a4444;
        color: #f5e6d3;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .rg-auth-close:hover { background: #4a5555; }
      .rg-auth-blurb {
        font-size: 13px;
        color: #b8a892;
        margin-bottom: 14px;
        line-height: 1.4;
      }
      .rg-auth-notice {
        font-size: 13px;
        color: #d4a373;
        background: #3d3226;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 14px;
        line-height: 1.35;
      }
      .rg-auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .rg-auth-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .rg-auth-label {
        font-size: 12px;
        color: #9aa0a0;
        letter-spacing: 0.02em;
      }
      .rg-auth-input {
        height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid #4a5555;
        background: #1e2424;
        color: #f5e6d3;
        font-size: 15px;
        outline: none;
      }
      .rg-auth-input:focus {
        border-color: #8fbc8f;
        box-shadow: 0 0 0 2px rgba(143, 188, 143, 0.25);
      }
      .rg-auth-note {
        font-size: 13px;
        color: #cfe3cf;
        background: #2f3d33;
        border: 1px solid #5f8a5f;
        border-radius: 8px;
        padding: 10px 12px;
        line-height: 1.35;
      }
      .rg-auth-note[hidden] { display: none; }
      .rg-auth-error {
        min-height: 18px;
        font-size: 13px;
        color: #e8a090;
        line-height: 1.3;
      }
      .rg-auth-primary {
        height: 44px;
        border: none;
        border-radius: 10px;
        background: #c43c3c;
        color: #f5e6d3;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 4px;
      }
      .rg-auth-primary:hover:not(:disabled) { background: #d44c4c; }
      .rg-auth-primary:disabled {
        opacity: 0.7;
        cursor: default;
      }
      .rg-auth-switch {
        font-size: 13px;
        color: #b8a892;
        text-align: center;
        margin-top: 4px;
      }
      .rg-auth-link {
        border: none;
        background: none;
        color: #e8c547;
        font-size: 13px;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }
      .rg-auth-link:hover { color: #f5d86a; }

      /* Pass R — Reset collection confirm (DESIGN.md v2.6.1) */
      .rg-auth-actions {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .rg-auth-secondary,
      .rg-auth-danger {
        flex: 1;
        height: 44px;
        border-radius: 10px;
        color: #f5e6d3;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .rg-auth-secondary {
        border: 1px solid #5a6a5a;
        background: #3a4444;
      }
      .rg-auth-secondary:hover:not(:disabled) { background: #4a5555; }
      .rg-auth-danger {
        border: none;
        background: #b23434;
      }
      .rg-auth-danger:hover:not(:disabled) { background: #c84444; }
      .rg-auth-secondary:focus,
      .rg-auth-danger:focus {
        outline: 2px solid #8fbc8f;
        outline-offset: 2px;
      }
      .rg-auth-secondary:disabled,
      .rg-auth-danger:disabled {
        opacity: 0.7;
        cursor: default;
      }
      /* Pass M1 — Sell to gallery confirm (DESIGN.md v2.7): Reset-style modal, primary red confirm */
      .rg-auth-actions .rg-auth-primary {
        flex: 1;
        margin-top: 0;
        font-size: 15px;
      }
      .rg-auth-actions .rg-auth-primary:focus {
        outline: 2px solid #8fbc8f;
        outline-offset: 2px;
      }

      /* Modern button + dialog skin (Harley 2026-09-26): same family as the Pass V cabinet —
         gunmetal panels, soft sheen, pink neon edges, amber for the main action. */
      .rg-auth-panel {
        background: linear-gradient(180deg, #2b2f36 0%, #1f2228 100%);
        border: 1px solid #5a616b;
        border-radius: 16px;
        box-shadow: 0 0 0 1px rgba(255, 47, 168, 0.35), 0 0 28px rgba(255, 47, 168, 0.18),
          0 18px 48px rgba(0, 0, 0, 0.6);
      }
      .rg-auth-close {
        border-radius: 50%;
        background: linear-gradient(180deg, #363c46, #2b2f36);
        border: 1px solid #5a616b;
        transition: box-shadow 0.15s, border-color 0.15s;
      }
      .rg-auth-close:hover {
        background: linear-gradient(180deg, #3e4550, #2f343c);
        border-color: #ff2fa8;
        box-shadow: 0 0 10px rgba(255, 47, 168, 0.45);
      }
      .rg-auth-input {
        border-radius: 10px;
        border: 1px solid #5a616b;
        background: #15171c;
      }
      .rg-auth-input:focus {
        border-color: #ff2fa8;
        box-shadow: 0 0 0 3px rgba(255, 47, 168, 0.22);
      }
      .rg-auth-primary,
      .rg-auth-secondary,
      .rg-auth-danger {
        border-radius: 12px;
        transition: transform 0.08s, box-shadow 0.15s, filter 0.15s;
      }
      .rg-auth-primary {
        background: linear-gradient(180deg, #ffcf4d 0%, #ffb000 55%, #e09400 100%);
        color: #2a1600;
        border: 1px solid #ffcf4d;
        box-shadow: 0 0 16px rgba(255, 176, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      .rg-auth-primary:hover:not(:disabled) {
        background: linear-gradient(180deg, #ffd766 0%, #ffba1a 55%, #e89c00 100%);
        box-shadow: 0 0 22px rgba(255, 176, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .rg-auth-secondary {
        background: linear-gradient(180deg, #363c46 0%, #2b2f36 100%);
        border: 1px solid #5a616b;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .rg-auth-secondary:hover:not(:disabled) {
        background: linear-gradient(180deg, #3e4550 0%, #30353e 100%);
        border-color: #ff2fa8;
        box-shadow: 0 0 12px rgba(255, 47, 168, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .rg-auth-danger {
        background: linear-gradient(180deg, #ff4f7a 0%, #d8264f 100%);
        border: 1px solid #ff8aa6;
        box-shadow: 0 0 14px rgba(255, 47, 90, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .rg-auth-danger:hover:not(:disabled) {
        filter: brightness(1.08);
        box-shadow: 0 0 20px rgba(255, 47, 90, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .rg-auth-primary:active:not(:disabled),
      .rg-auth-secondary:active:not(:disabled),
      .rg-auth-danger:active:not(:disabled) {
        transform: translateY(1px);
      }
      .rg-auth-secondary:focus,
      .rg-auth-danger:focus,
      .rg-auth-actions .rg-auth-primary:focus {
        outline: 2px solid #ff2fa8;
        outline-offset: 2px;
      }
      .rg-auth-link { color: #ffcf4d; }
      .rg-auth-link:hover { color: #ffe08a; }

      /* Loading screen (Harley 2026-09-30): his History Packs picture, shown from the first moment
         the page opens until the game is ready. */
      #rg-loading {
        position: fixed;
        inset: 0;
        z-index: 9000;
        background: #0b0712;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.6s ease;
      }
      #rg-loading.rg-done { opacity: 0; pointer-events: none; }
      #rg-loading .rg-load-bg {
        position: absolute;
        inset: -40px;
        background: url(loading.webp) center / cover no-repeat;
        filter: blur(28px) brightness(0.45);
      }
      #rg-loading img {
        position: relative;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
      }
      #rg-loading .rg-load-bar {
        position: absolute;
        left: 50%;
        bottom: max(28px, 5vh);
        width: min(260px, 60vw);
        height: 6px;
        transform: translateX(-50%);
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.55);
        box-shadow: 0 0 0 1px rgba(255, 207, 77, 0.35);
        overflow: hidden;
      }
      #rg-loading .rg-load-bar i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #ffcf4d, #fff4c2, #ffcf4d, transparent);
        animation: rg-load 1.3s ease-in-out infinite;
      }
      #rg-loading .rg-load-txt {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(max(28px, 5vh) + 14px);
        text-align: center;
        font: 600 13px/1 Georgia, serif;
        letter-spacing: 0.08em;
        color: #ffe3a1;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      }
      @keyframes rg-load { from { left: -40%; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { #rg-loading .rg-load-bar i { animation: none; left: 30%; } }

    </style>
  </head>
  <body>
    <div id="rg-loading" role="img" aria-label="History Packs is loading">
      <div class="rg-load-bg"></div>
      <img src="loading.webp" alt="History Packs booster boxes and packs" />
      <div class="rg-load-txt">Opening the vault…</div>
      <div class="rg-load-bar"><i></i></div>
    </div>
    <script>
      /* The game calls this when it is ready; the picture stays up at least 1.5 s so it can be seen. */
      (function () {
        var t0 = Date.now();
        window.__rgHideLoading = function () {
          var el = document.getElementById('rg-loading');
          if (!el) return;
          setTimeout(function () {
            el.classList.add('rg-done');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
          }, Math.max(0, 1500 - (Date.now() - t0)));
        };
        /* Never leave the picture up for ever if something goes wrong while loading. */
        setTimeout(function () { window.__rgHideLoading(); }, 30000);
      })();
    </script>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
