<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- v1.8.4 phones: dark page (stops Samsung Internet's dark mode from re-colouring the game), toolbar colour, home-screen title. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a2020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="History Packs" />
    <meta name="format-detection" content="telephone=no" />
    <title>History Packs</title>
    <link rel="preload" as="image" href="pack-bg.webp" />
    <!-- v2.0 look (Harley 2026-11-17): engraved Roman capitals for logos, packs and buttons.
         Cinzel (SIL Open Font License, fonts/Cinzel-OFL.txt), served with the game so it works offline. -->
    <link rel="preload" as="font" type="font/ttf" href="fonts/cinzel.ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'Cinzel';
        src: url('fonts/cinzel.ttf') format('truetype');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        color-scheme: dark;
        /* No long-press text selection / callout menu or double-tap zoom while tearing packs (iPhone, Android). */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        width: 100%;
        height: 100%;
        background: #1a2020;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        display: block;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }

      /* Pass D — auth overlay (DESIGN.md v2.0) */
      .rg-auth-root {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
      }
      .rg-auth-root.rg-auth-open {
        pointer-events: auto;
      }
      .rg-auth-backdrop {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        inset: 0;
        background: rgba(12, 16, 16, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .rg-auth-panel {
        width: min(400px, 100%);
        background: #2a322e;
        border: 2px solid #5a6a5a;
        border-radius: 12px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
        padding: 22px 24px 20px;
        color: #f5e6d3;
      }
      .rg-auth-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }
      .rg-auth-title {
        font-family: Georgia, serif;
        font-size: 22px;
        font-weight: normal;
        color: #f5e6d3;
      }
      .rg-auth-close {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 8px;
        background: #3a4444;
        color: #f5e6d3;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .rg-auth-close:hover { background: #4a5555; }
      .rg-auth-blurb {
        font-size: 13px;
        color: #b8a892;
        margin-bottom: 14px;
        line-height: 1.4;
      }
      .rg-auth-notice {
        font-size: 13px;
        color: #d4a373;
        background: #3d3226;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 14px;
        line-height: 1.35;
      }
      .rg-auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .rg-auth-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .rg-auth-label {
        font-size: 12px;
        color: #9aa0a0;
        letter-spacing: 0.02em;
      }
      .rg-auth-input {
        height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid #4a5555;
        background: #1e2424;
        color: #f5e6d3;
        font-size: 15px;
        outline: none;
      }
      .rg-auth-input:focus {
        border-color: #8fbc8f;
        box-shadow: 0 0 0 2px rgba(143, 188, 143, 0.25);
      }
      .rg-auth-note {
        font-size: 13px;
        color: #cfe3cf;
        background: #2f3d33;
        border: 1px solid #5f8a5f;
        border-radius: 8px;
        padding: 10px 12px;
        line-height: 1.35;
      }
      .rg-auth-note[hidden] { display: none; }
      .rg-auth-error {
        min-height: 18px;
        font-size: 13px;
        color: #e8a090;
        line-height: 1.3;
      }
      .rg-auth-primary {
        height: 44px;
        border: none;
        border-radius: 10px;
        background: #c43c3c;
        color: #f5e6d3;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 4px;
      }
      .rg-auth-primary:hover:not(:disabled) { background: #d44c4c; }
      .rg-auth-primary:disabled {
        opacity: 0.7;
        cursor: default;
      }
      .rg-auth-switch {
        font-size: 13px;
        color: #b8a892;
        text-align: center;
        margin-top: 4px;
      }
      .rg-auth-link {
        border: none;
        background: none;
        color: #e8c547;
        font-size: 13px;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }
      .rg-auth-link:hover { color: #f5d86a; }

      /* Pass R — Reset collection confirm (DESIGN.md v2.6.1) */
      .rg-auth-actions {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .rg-auth-secondary,
      .rg-auth-danger {
        flex: 1;
        height: 44px;
        border-radius: 10px;
        color: #f5e6d3;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .rg-auth-secondary {
        border: 1px solid #5a6a5a;
        background: #3a4444;
      }
      .rg-auth-secondary:hover:not(:disabled) { background: #4a5555; }
      .rg-auth-danger {
        border: none;
        background: #b23434;
      }
      .rg-auth-danger:hover:not(:disabled) { background: #c84444; }
      .rg-auth-secondary:focus,
      .rg-auth-danger:focus {
        outline: 2px solid #8fbc8f;
        outline-offset: 2px;
      }
      .rg-auth-secondary:disabled,
      .rg-auth-danger:disabled {
        opacity: 0.7;
        cursor: default;
      }
      /* Pass M1 — Sell to gallery confirm (DESIGN.md v2.7): Reset-style modal, primary red confirm */
      .rg-auth-actions .rg-auth-primary {
        flex: 1;
        margin-top: 0;
        font-size: 15px;
      }
      .rg-auth-actions .rg-auth-primary:focus {
        outline: 2px solid #8fbc8f;
        outline-offset: 2px;
      }

      /* Modern button + dialog skin (Harley 2026-09-26): same family as the Pass V cabinet —
         gunmetal panels, soft sheen, pink neon edges, amber for the main action. */
      .rg-auth-panel {
        background: linear-gradient(180deg, #2b2f36 0%, #1f2228 100%);
        border: 1px solid #5a616b;
        border-radius: 16px;
        box-shadow: 0 0 0 1px rgba(255, 47, 168, 0.35), 0 0 28px rgba(255, 47, 168, 0.18),
          0 18px 48px rgba(0, 0, 0, 0.6);
      }
      .rg-auth-close {
        border-radius: 50%;
        background: linear-gradient(180deg, #363c46, #2b2f36);
        border: 1px solid #5a616b;
        transition: box-shadow 0.15s, border-color 0.15s;
      }
      .rg-auth-close:hover {
        background: linear-gradient(180deg, #3e4550, #2f343c);
        border-color: #ff2fa8;
        box-shadow: 0 0 10px rgba(255, 47, 168, 0.45);
      }
      .rg-auth-input {
        border-radius: 10px;
        border: 1px solid #5a616b;
        background: #15171c;
      }
      .rg-auth-input:focus {
        border-color: #ff2fa8;
        box-shadow: 0 0 0 3px rgba(255, 47, 168, 0.22);
      }
      .rg-auth-primary,
      .rg-auth-secondary,
      .rg-auth-danger {
        border-radius: 12px;
        transition: transform 0.08s, box-shadow 0.15s, filter 0.15s;
      }
      .rg-auth-primary {
        background: linear-gradient(180deg, #ffcf4d 0%, #ffb000 55%, #e09400 100%);
        color: #2a1600;
        border: 1px solid #ffcf4d;
        box-shadow: 0 0 16px rgba(255, 176, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      .rg-auth-primary:hover:not(:disabled) {
        background: linear-gradient(180deg, #ffd766 0%, #ffba1a 55%, #e89c00 100%);
        box-shadow: 0 0 22px rgba(255, 176, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .rg-auth-secondary {
        background: linear-gradient(180deg, #363c46 0%, #2b2f36 100%);
        border: 1px solid #5a616b;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .rg-auth-secondary:hover:not(:disabled) {
        background: linear-gradient(180deg, #3e4550 0%, #30353e 100%);
        border-color: #ff2fa8;
        box-shadow: 0 0 12px rgba(255, 47, 168, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .rg-auth-danger {
        background: linear-gradient(180deg, #ff4f7a 0%, #d8264f 100%);
        border: 1px solid #ff8aa6;
        box-shadow: 0 0 14px rgba(255, 47, 90, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .rg-auth-danger:hover:not(:disabled) {
        filter: brightness(1.08);
        box-shadow: 0 0 20px rgba(255, 47, 90, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .rg-auth-primary:active:not(:disabled),
      .rg-auth-secondary:active:not(:disabled),
      .rg-auth-danger:active:not(:disabled) {
        transform: translateY(1px);
      }
      .rg-auth-secondary:focus,
      .rg-auth-danger:focus,
      .rg-auth-actions .rg-auth-primary:focus {
        outline: 2px solid #ff2fa8;
        outline-offset: 2px;
      }
      .rg-auth-link { color: #ffcf4d; }
      .rg-auth-link:hover { color: #ffe08a; }

      /* Loading screen (Harley 2026-09-30): his History Packs picture, shown from the first moment
         the page opens until the game is ready. */
      #rg-loading {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        inset: 0;
        z-index: 9000;
        background: #0b0712;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.6s ease;
      }
      #rg-loading.rg-done { opacity: 0; pointer-events: none; }
      #rg-loading .rg-load-bg {
        position: absolute;
        top: -40px; right: -40px; bottom: -40px; left: -40px;
        inset: -40px;
        background: url(loading.webp) center / cover no-repeat;
        filter: blur(28px) brightness(0.45);
      }
      /* v2.9 (Harley 2026-11-18): his new loading picture. The painted bar is emptied in the picture;
         a live red fill (loading-fill.webp, stretched) and the percentage sit exactly over it. All
         positions are fractions of the 1672×941 picture, so they line up at any size. */
      #rg-loading .rg-load-frame {
        position: relative;
        width: min(100vw, calc(100vh * 1672 / 941));
        width: min(100vw, calc(100dvh * 1672 / 941));
        aspect-ratio: 1672 / 941;
        container-type: inline-size;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
      }
      /* Upright phones: zoom in so the picture isn't a thin strip; the sides are trimmed but the
         logo and the bar (25.8%–74.2% across) stay in view. */
      @media (orientation: portrait) {
        #rg-loading .rg-load-frame { width: 140vw; flex: 0 0 auto; }
      }
      #rg-loading .rg-load-frame img {
        display: block;
        width: 100%;
        height: 100%;
      }
      #rg-loading .rg-load-track {
        position: absolute;
        left: 25.837%;
        top: 88.416%;
        width: 41.806%;
        height: 4.463%;
        overflow: hidden;
        border-radius: 2px 40% 40% 2px / 2px 50% 50% 2px;
      }
      #rg-loading .rg-load-fill {
        width: 0%;
        height: 100%;
        background: url(loading-fill.webp) 0 0 / 100% 100% no-repeat;
      }
      #rg-loading .rg-load-pct {
        position: absolute;
        left: 67.82%;
        top: 88.416%;
        width: 6.34%;
        height: 4.463%;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 700 1.9vw/1 Georgia, 'Times New Roman', serif;
        font-size: 2.15cqw;
        color: #f4efe6;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        letter-spacing: 0.02em;
      }

          /* v1.8.4: text boxes stay typeable (Safari needs user-select on inputs), and 16px stops
         iPhone Safari zooming the page when a box is tapped. */
      input, textarea, select, .rg-auth-input {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      @media (pointer: coarse) {
        input, textarea, select, .rg-auth-input { font-size: 16px; }
      }
      /* Older iPhones (iOS 15) don't know cqw: size the percentage from the screen width instead. */
      @media (orientation: portrait) {
        #rg-loading .rg-load-pct { font-size: 2.66vw; font-size: 2.15cqw; }
      }
    </style>
  </head>
  <body>
    <div id="rg-loading" role="img" aria-label="History Packs is loading">
      <div class="rg-load-bg"></div>
      <div class="rg-load-frame">
        <img src="loading.webp" alt="History Packs: Loading" />
        <div class="rg-load-track"><div class="rg-load-fill"></div></div>
        <div class="rg-load-pct">0%</div>
      </div>
    </div>
    <script>
      /* The game calls this when it is ready; the picture stays up at least 1.5 s so it can be seen. */
      (function () {
        var t0 = Date.now();
        /* v2.9 progress bar: the game reports real steps with __rgLoadStep(done, ceiling); between steps
           the bar creeps slowly toward the ceiling so it never looks stuck, and never passes it. */
        var shown = 0, target = 0.03, ceiling = 0.35, done = false;
        var fill = document.querySelector('#rg-loading .rg-load-fill');
        var pct = document.querySelector('#rg-loading .rg-load-pct');
        window.__rgLoadStep = function (f, cap) {
          target = Math.max(target, f);
          ceiling = Math.max(ceiling, cap || f, target);
        };
        function tick() {
          if (!done && target < ceiling) target = Math.min(ceiling, target + 0.0012);
          shown += (target - shown) * 0.12;
          if (target - shown < 0.002) shown = target;
          if (fill) fill.style.width = (shown * 100).toFixed(2) + '%';
          if (pct) pct.textContent = Math.round(shown * 100) + '%';
          if (shown < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        window.__rgHideLoading = function () {
          var el = document.getElementById('rg-loading');
          if (!el) return;
          done = true;
          target = ceiling = 1;
          setTimeout(function () {
            el.classList.add('rg-done');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
          }, Math.max(400, 1500 - (Date.now() - t0)));
        };
        /* Never leave the picture up for ever if something goes wrong while loading. */
        setTimeout(function () { window.__rgHideLoading(); }, 30000);
      })();
    </script>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
